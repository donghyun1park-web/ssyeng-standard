name: Keep Render Alive

# Render 무료 플랜은 15분 비활성 시 자동 슬립.
# 10분마다 헬스체크 ping을 보내 슬립을 방지합니다.
# (GitHub Actions cron이 지연될 가능성을 고려해 여유 둠)

on:
  schedule:
    - cron: '*/10 * * * *'   # 매 10분마다 실행
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health (with retry for cold start)
        run: |
          URL="https://ssyeng-standard.onrender.com/api/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Service is alive."
              exit 0
            fi
            echo "  Cold start? Wait 15s before retry..."
            sleep 15
          done
          echo "✗ Service still not responding after 5 attempts."
          exit 1
