services:
  - type: web
    name: ssyeng-standard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: ADMIN_TOKEN
        sync: false           # Render 대시보드에서 강력한 랜덤 값으로 입력
      - key: GEMINI_API_KEY
        sync: false           # Google AI Studio 키 (선택; 없으면 로컬 fallback)
      - key: CORS_ALLOW_ORIGINS
        value: "*"            # 사내 단일 서비스이므로 와일드카드 OK
